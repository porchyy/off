# PostureAI Pi client configuration
# setup-pi5.sh creates config.yaml from this file automatically.

backend:
  # URL ของ FastAPI backend — ค่า default ตรงกับ docker-compose service
  url: http://localhost:8000
  # timeout (วินาที) สำหรับ HTTP call
  timeout: 5
  # Pi จะอ่านค่าตรวจจับจาก Dashboard ใหม่ตามช่วงเวลานี้; ใช้ config นี้เป็น fallback เมื่อ backend ล่ม
  settings_sync_seconds: 30

camera:
  # Pi 5 default: Pi Camera through Picamera2. Set auto to also fall back to USB.
  backend: picamera2
  # index ใช้กับ USB camera (OpenCV) เท่านั้น; auto = ตรวจหา /dev/video*
  index: auto
  retries: 3
  # ความกว้าง/สูงของ frame ที่ใช้ประมวลผล
  width: 640
  height: 360
  # flip: 0=none, 1=horizontal, -1=both
  flip: 0

detection:
  # false = ไม่เรียก MediaPipe (ใช้ Roboflow เพียงตัวเดียว)
  enabled: true
  # ความถี่การวิเคราะห์และบันทึกคะแนน (วินาที, 0.1 = 10 FPS)
  interval: 0.1
  # ทำให้เส้น skeleton นิ่งขึ้นโดยไม่หน่วงคะแนน/การแจ้งเตือน
  # 0.65 = ตามการเคลื่อนไหวเร็วและยังลดอาการสั่นได้
  overlay_smoothing_alpha: 0.65
  # เก็บจุดล่าสุดชั่วคราวเมื่อ AI มองไม่เห็น เพื่อไม่ให้เส้นกระพริบ
  overlay_hold_seconds: 0.2
  # ไม่วาดจุดที่ AI มั่นใจต่ำกว่าค่านี้
  overlay_min_visibility: 0.35
  # กรองคะแนนก่อนส่ง Dashboard/LED: ลดเลขแกว่งจาก landmark ที่สั่น
  # 0.35 = นิ่งขึ้นโดยหน่วงการเปลี่ยนท่าราวไม่กี่เฟรม; เพิ่มค่าให้ตอบสนองไวขึ้น
  metric_smoothing_alpha: 0.35
  # โหมดที่รองรับในรุ่นนี้: mediapipe (ประมวลผลบน Pi เท่านั้น)
  mode: mediapipe
  # upper_body = ใช้คอและไหล่เท่านั้น (ไม่ใช้สะโพก/ขา); image_classifier = ใช้ ONNX ด้านล่างแทนคะแนน
  score_source: upper_body
  # โมเดลเดียวกับหน้าเว็บ: Pose Landmarker Full สำหรับความแม่นยำสูงขึ้น
  model: ../frontend/public/models/pose_landmarker_full.task

# ตัวเลือก: AI จำแนกท่านั่งที่เทรนแล้ว (ใช้เมื่อ detection.score_source: image_classifier)
# ค่า default ปิดไว้ เพื่อให้คะแนนหลักใช้คอ/ไหล่ ไม่ขึ้นกับภาพทั้งเฟรม
posture_classifier:
  enabled: false
  model: models/kanden_posture_classifier.onnx
  # วิเคราะห์ภาพทุก 0.5 วินาที แล้วใช้ผลล่าสุดระหว่างนั้นเพื่อให้ Pi ลื่น
  interval: 0.5
  # ความมั่นใจต่ำกว่านี้จะกลับไปใช้คะแนนจาก MediaPipe ชั่วคราว
  min_confidence: 0.65

# AI เสริมจาก Roboflow: ใช้ผล Good/Slouch/Leaning บนหน้าเว็บ
# API key ต้องอยู่ใน environment ของ systemd เท่านั้น ไม่ใส่ในไฟล์นี้
roboflow:
  enabled: false
  model_id: sitting-posture-detection-3933f/2
  interval: 1.0
  confidence: 0.6
  timeout: 8
  # Resize only the cloud request; this never reduces dashboard video quality.
  input_width: 640
  api_key_env: ROBOFLOW_API_KEY

video:
  # WebRTC preview อยู่ใน LAN โดยภาพไม่ถูกบันทึกลงดิสก์
  enabled: true
  width: 640
  height: 360
  fps: 12

# TOF400C / VL53L1X ติดใกล้กล้องและหันไปช่วงหน้าอกของผู้ใช้
# service postureai-sensors เป็นผู้เปิด I2C; client อ่านค่าผ่าน backend จึงไม่แย่ง I2C กัน
tof400c:
  enabled: true
  poll_seconds: 0.5
  stale_seconds: 3
  # เก็บ 6 ค่า (ประมาณ 3 วินาทีเมื่อ sensor service ส่งทุก 0.5 วินาที) เป็นท่านั่งอ้างอิงอัตโนมัติ
  calibration_samples: 6
  absence_reset_seconds: 8
  # ระยะลด = โน้มเข้าหากล้อง, ระยะเพิ่ม = เอนออกจากกล้อง
  forward_start_cm: 8
  recline_start_cm: 10
  forward_points_per_cm: 2.0
  recline_points_per_cm: 1.5
  max_forward_penalty: 35
  max_recline_penalty: 25

risk:
  threshold: 60
  # 0 = แจ้งเตือนทันทีเมื่อคะแนนต่ำกว่าเกณฑ์
  seconds: 0
  # เว้นระยะก่อนเล่นเสียงซ้ำ ขณะที่ท่ายังไม่ดีขึ้น
  cooldown: 30

sound:
  enabled: true
  # ใช้เฉพาะ MAX98357A I2S DAC/amplifier; setup-max98357.sh ตั้งค่าให้อัตโนมัติ
  device: "plughw:CARD=MAX98357A,DEV=0"
  volume: 0.75
  # เว้นว่างเพื่อใช้เสียง beep ในตัว หรือระบุไฟล์ WAV เช่น ./alert.wav
  file:

# โมดูล LED สีแดงในรูป: เริ่มต้นปิดไว้จนกว่าจะต่อสายเสร็จ
indicator:
  enabled: false
  # BCM GPIO number (ไม่ใช่เลข physical pin): ค่า default คือ GPIO17 / physical pin 11
  pin: 17
  # เว้นว่างเพื่อให้ตรวจหา GPIO ของ Pi 5 อัตโนมัติ; ระบุเลขได้ เช่น 15
  chip:
  # false หากโมดูลของคุณติดเมื่อสัญญาณ LOW
  active_high: true
  # คะแนนต่ำกว่าเกณฑ์นี้ต่อเนื่องจึงพิจารณาเปิดไฟ
  threshold: 50
  # รอ 5 วินาทีเพื่อไม่ให้ไฟติดระหว่างขยับตัวชั่วคราว
  delay_seconds: 5

# ไม่ใช้ GPIO buzzer ในชุด MAX98357A นี้
buzzer:
  enabled: false
  # BCM GPIO number: ค่า default คือ GPIO27 / physical pin 13
  pin: 27
  active_high: true
  # ดังทันทีเมื่อคะแนนต่ำกว่าค่านี้ และหยุดดังเมื่อคะแนนกลับมาถึงเกณฑ์
  threshold: 50

# LCD 1602 พร้อม I2C backpack (ขั้ว GND, VCC, SDA, SCL)
# เปิดใช้หลังตรวจ address ด้วย `sudo i2cdetect -y 1`
lcd:
  enabled: false
  i2c_address: 0x27
  i2c_port: 1
  columns: 16
  rows: 2
  # ลดการเขียนถี่เกินไปเพื่อให้ตัวอักษรไม่กระพริบ
  update_seconds: 0.5

buffer:
  # path ของ SQLite ที่ใช้ buffer ตอน backend offline
  path: ./buffer.sqlite
