# PostureAI Pi client configuration
# setup-pi5.sh creates config.yaml from this file automatically.

backend:
  # URL ของ FastAPI backend — ค่า default ตรงกับ docker-compose service
  url: http://localhost:8000
  # timeout (วินาที) สำหรับ HTTP call
  timeout: 5
  # Pi จะอ่านค่าตรวจจับจาก Dashboard ใหม่ตามช่วงเวลานี้; ใช้ config นี้เป็น fallback เมื่อ backend ล่ม
  settings_sync_seconds: 30

camera:
  # Pi 5 default: Pi Camera through Picamera2. Set auto to also fall back to USB.
  backend: picamera2
  # index ใช้กับ USB camera (OpenCV) เท่านั้น; auto = ตรวจหา /dev/video*
  index: auto
  retries: 3
  # ความกว้าง/สูงของ frame ที่ใช้ประมวลผล
  width: 640
  height: 360
  # flip: 0=none, 1=horizontal, -1=both
  flip: 0

detection:
  # false = ไม่เรียก YOLOv5 (ใช้ Roboflow เพียงตัวเดียว)
  enabled: true
  # ความถี่การวิเคราะห์และบันทึกคะแนน (วินาที)
  interval: 0.5
  # โหมด local AI: YOLOv5 sitting_good / sitting_bad
  mode: yolov5
  model: models/small640.pt
  model_url: https://raw.githubusercontent.com/itakurah/Sitting-Posture-Detection-YOLOv5/main/data/inference_models/small640.pt
  confidence: 0.5
  iou: 0.5

# AI เสริมจาก Roboflow: ใช้ผล Good/Slouch/Leaning บนหน้าเว็บ
# API key ต้องอยู่ใน environment ของ systemd เท่านั้น ไม่ใส่ในไฟล์นี้
roboflow:
  enabled: false
  model_id: sitting-posture-detection-3933f/2
  interval: 1.0
  confidence: 0.6
  timeout: 8
  # Resize only the cloud request; this never reduces dashboard video quality.
  input_width: 640
  api_key_env: ROBOFLOW_API_KEY

video:
  # WebRTC preview อยู่ใน LAN โดยภาพไม่ถูกบันทึกลงดิสก์
  enabled: true
  width: 640
  height: 360
  fps: 12

risk:
  threshold: 60
  # 0 = แจ้งเตือนทันทีเมื่อคะแนนต่ำกว่าเกณฑ์
  seconds: 0
  # เว้นระยะก่อนเล่นเสียงซ้ำ ขณะที่ท่ายังไม่ดีขึ้น
  cooldown: 30

sound:
  enabled: true
  # ใช้เฉพาะ MAX98357A I2S DAC/amplifier; setup-max98357.sh ตั้งค่าให้อัตโนมัติ
  device: "plughw:CARD=MAX98357A,DEV=0"
  volume: 0.75
  # เว้นว่างเพื่อใช้เสียง beep ในตัว หรือระบุไฟล์ WAV เช่น ./alert.wav
  file:

# โมดูล LED สีแดงในรูป: เริ่มต้นปิดไว้จนกว่าจะต่อสายเสร็จ
indicator:
  enabled: false
  # BCM GPIO number (ไม่ใช่เลข physical pin): ค่า default คือ GPIO17 / physical pin 11
  pin: 17
  # เว้นว่างเพื่อให้ตรวจหา GPIO ของ Pi 5 อัตโนมัติ; ระบุเลขได้ เช่น 15
  chip:
  # false หากโมดูลของคุณติดเมื่อสัญญาณ LOW
  active_high: true
  # ติดทันทีเมื่อคะแนนต่ำกว่าค่านี้ และดับทันทีเมื่อคะแนนกลับมาถึงเกณฑ์
  threshold: 50

# ไม่ใช้ GPIO buzzer ในชุด MAX98357A นี้
buzzer:
  enabled: false
  # BCM GPIO number: ค่า default คือ GPIO27 / physical pin 13
  pin: 27
  active_high: true
  # ดังทันทีเมื่อคะแนนต่ำกว่าค่านี้ และหยุดดังเมื่อคะแนนกลับมาถึงเกณฑ์
  threshold: 50

# LCD 1602 พร้อม I2C backpack (ขั้ว GND, VCC, SDA, SCL)
# เปิดใช้หลังตรวจ address ด้วย `sudo i2cdetect -y 1`
lcd:
  enabled: false
  i2c_address: 0x27
  i2c_port: 1
  columns: 16
  rows: 2
  # ลดการเขียนถี่เกินไปเพื่อให้ตัวอักษรไม่กระพริบ
  update_seconds: 0.5

buffer:
  # path ของ SQLite ที่ใช้ buffer ตอน backend offline
  path: ./buffer.sqlite
