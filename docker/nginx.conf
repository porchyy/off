map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cache static assets aggressively, but never cache the SPA entry or
    # anything under /api.
    location ~* \.(?:js|css|svg|woff2?|bin|json|tflite|onnx|task|wasm)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location = / {
        try_files /index.html =404;
    }

    # Forward API calls to the FastAPI backend running on the same compose
    # network. In dev you can also point POSTUREAI_BACKEND_URL elsewhere.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # SPA fallback — anything that isn't a real file, isn't an /api call, and
    # isn't in the asset cache, gets the index so the app can take over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
