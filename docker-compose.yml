# PostureAI — local development stack.
#
# Usage:
#   docker compose up --build
#
# Services:
#   backend  - FastAPI on :8000, SQLite at ./database/postureai.sqlite
#   web      - Static frontend on :3000, proxies /api to backend

services:
  backend:
    container_name: postureai-backend
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1024M
    environment:
      POSTUREAI_DATA_DIR: /app/database
      # The dashboard is reverse-proxied by nginx, so browsers use the same
      # origin and the API never needs a permissive CORS policy.
      POSTUREAI_CORS_ORIGINS: "http://localhost:3000"
      POSTUREAI_HOST: 0.0.0.0
      POSTUREAI_PORT: 8000
      POSTUREAI_REQUIRE_ADMIN_TOKEN: "true"
      POSTUREAI_ADMIN_TOKEN: "${POSTUREAI_ADMIN_TOKEN:-}"
      POSTUREAI_RETENTION_DAYS: "30"
    volumes:
      - ./database:/app/database
    ports:
      # Pi client and nginx can reach this on the compose network. Binding to
      # loopback keeps raw API endpoints off the rest of the LAN.
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

  web:
    container_name: postureai-web
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
